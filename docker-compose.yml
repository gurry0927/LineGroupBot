name: linebot

services:
  linebot:
    build: .
    container_name: linebot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - /data/linebot:/app/data
    environment:
      - TZ=Asia/Taipei
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/health',timeout=3).status<400 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
